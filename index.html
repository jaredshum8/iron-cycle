<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WorkOut">
<meta name="theme-color" content="#F6F4FB">
<link rel="apple-touch-icon" href="app-icon/workout-180.png">
<link rel="icon" href="app-icon/workout-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:var(--top,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>WorkOut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: single-column phone app (max 520px) with a floating tab bar.
   Three themes: 柔霧 soft lilac (default light), 蜜桃 peach (light), 夜練 night (dark).
   Brand accent = gradient; the week's training phase gets its own colour on phase elements only. */
:root,[data-theme="soft"]{
  --bg:#F6F4FB; --bg2:#EFEAFB; --surface:#FFFFFF; --surface2:#F3F0FA; --line:#EEEAF6; --line2:#E2DCF0;
  --text:#2B2540; --muted:#7E7795; --faint:#B0A9C2;
  --accent:#8B7CF6; --accent2:#F29CC0; --accent-soft:rgba(139,124,246,.12); --on-accent:#FFFFFF;
  --danger:#E5546C; --danger-soft:rgba(229,84,108,.1); --ok:#2FB98A;
  --shadow:0 6px 22px rgba(70,50,140,.08); --shadow-sm:0 2px 10px rgba(70,50,140,.06);
  --scrim:rgba(30,20,60,.32); --glass:rgba(255,255,255,.82);
  color-scheme:light;
}
[data-theme="peach"]{
  --bg:#FBF6F2; --bg2:#FCE9DF; --surface:#FFFFFF; --surface2:#F9EFE9; --line:#F4E8E1; --line2:#ECDCD2;
  --text:#3A2B27; --muted:#8E7C75; --faint:#C2AFA7;
  --accent:#F0866A; --accent2:#F5BF73; --accent-soft:rgba(240,134,106,.13); --on-accent:#FFFFFF;
  --danger:#D9465E; --danger-soft:rgba(217,70,94,.1); --ok:#2FA97E;
  --shadow:0 6px 22px rgba(140,70,40,.08); --shadow-sm:0 2px 10px rgba(140,70,40,.06);
  --scrim:rgba(60,30,20,.3); --glass:rgba(255,255,255,.84);
  color-scheme:light;
}
[data-theme="night"]{
  --bg:#13111B; --bg2:#1E1830; --surface:#1C1926; --surface2:#262232; --line:#2C2839; --line2:#3A3449;
  --text:#F2EFF9; --muted:#A39CB5; --faint:#6E6784;
  --accent:#A797FF; --accent2:#F59BC4; --accent-soft:rgba(167,151,255,.16); --on-accent:#16121F;
  --danger:#FF7A8E; --danger-soft:rgba(255,122,142,.13); --ok:#5ADBA9;
  --shadow:0 8px 26px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.55); --glass:rgba(28,25,38,.85);
  color-scheme:dark;
}
:root{
  --phase:#2EB88A; --phase-soft:rgba(46,184,138,.13);
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Nunito","SF Pro Rounded",ui-rounded,-apple-system,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,var(--bg2),transparent 70%);background-attachment:fixed;color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
/* Home-screen mode: content starts just below the status bar and scrolls under it like a native app */
.standalone{--top:calc(env(safe-area-inset-top,0px) + 6px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:800}
.muted{color:var(--muted)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(118px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h1{font-size:30px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:14px;white-space:nowrap;color:var(--text);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--grad);color:var(--on-accent);box-shadow:0 8px 20px -6px var(--accent)}
.btn.big{height:58px;font-size:17px;border-radius:18px;width:100%;letter-spacing:.04em}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface2);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ph{background:var(--phase-soft);color:var(--phase)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}

/* top */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.brand{font-family:var(--f-num);font-weight:800;letter-spacing:.16em;font-size:11px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* phase card */
.phase-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px;background:linear-gradient(140deg,var(--phase-soft),var(--surface) 62%);box-shadow:var(--shadow)}
.phase-card .plate{position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;border:14px solid var(--phase);opacity:.12}
.phase-card .plate::after{content:"";position:absolute;inset:34px;border-radius:50%;border:5px solid var(--phase)}
.phase-name{font-size:26px;font-weight:700;color:var(--phase);line-height:1.2}
.phase-en{font-family:var(--f-num);font-weight:800;letter-spacing:.18em;font-size:11px;color:var(--muted)}
.cyc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.cyc div{display:flex;flex-direction:column;gap:6px}
.cyc i{display:block;height:7px;border-radius:4px;background:var(--line2)}
.cyc span{font-size:11px;color:var(--faint);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc .cur span{color:var(--text);font-weight:700}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:16px;color:var(--muted)}
.wd b{font-family:var(--f-num);font-size:19px;font-weight:800;color:var(--text);line-height:1.1}
.wd small{font-size:11px;font-weight:500}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .dot.plan.has{background:var(--accent)}
.wd .dot.done{background:var(--ok)}
.wd.today b{color:var(--accent)}
.wd.sel{background:var(--grad);color:var(--on-accent);box-shadow:0 6px 16px -6px var(--accent)}
.wd.sel b,.wd.sel small{color:var(--on-accent)}
.wd.sel .dot.plan.has,.wd.sel .dot.done{background:var(--on-accent)}

/* day */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.day-title{font-size:24px;font-weight:700}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta b{font-family:var(--f-num);font-size:18px;color:var(--text);font-weight:800;margin-right:3px}
.ex-list{display:flex;flex-direction:column}
.ex-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);text-align:left;width:100%;color:var(--text)}
.ex-row:first-child{border-top:0}
/* mini muscle icon */
.mi{width:46px;height:46px;border-radius:50%;flex:none;overflow:hidden;display:block;background:radial-gradient(circle at 50% 35%,var(--surface) 0%,var(--surface2) 75%);box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(40,20,80,.06)}
.mi svg{width:100%;height:100%;display:block}
.mi.sm{width:30px;height:30px}
.mi.lg{width:58px;height:58px}
.mi-b{fill:var(--mi-body)}
.mi-m{fill:var(--mi-mus);stroke:var(--mi-body);stroke-width:2}
.mi-p{fill:url(#miG);stroke:var(--mi-body);stroke-width:2}
.mi-s{fill:var(--accent);opacity:.42;stroke:var(--mi-body);stroke-width:2}
:root{--mi-body:color-mix(in srgb,var(--line2) 80%,var(--surface));--mi-mus:color-mix(in srgb,var(--line2) 70%,var(--muted) 30%)}
.mus-panel{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;background:var(--surface2)}
.mus-figs{display:flex;gap:4px;flex:none}
.mus-figs>div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.mus-figs svg{width:56px;height:88px}
.mus-c{background:var(--surface);color:var(--muted)}.mus-c.p{background:var(--grad);color:var(--on-accent)}

.ex-name{font-weight:700;font-size:15px;line-height:1.35}
.ex-sub{font-size:13px;color:var(--muted)}
.ex-sub .num{font-size:14px;color:var(--text)}
.chev{width:18px;height:18px;color:var(--faint);flex:none}
.banner{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:var(--r-lg);background:var(--grad);color:var(--on-accent);font-weight:700;width:100%;text-align:left;box-shadow:0 10px 24px -8px var(--accent)}
.banner .num{font-size:24px}
.rest-day{text-align:center;padding:30px 18px}
.rest-day h2{font-size:22px;margin-bottom:6px}

/* floating tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(40,30,80,.14)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:20px;font-size:11px;font-weight:700;color:var(--faint)}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}

/* library */
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:34px;padding:0 15px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-sm);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--grad);color:var(--on-accent)}
.group-h{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 4px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.tile .num{font-size:28px;line-height:1.05}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--faint);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--muted)}
.cal button.has{color:var(--text);background:var(--surface2)}
.cal button.sel{outline:2px solid var(--accent)}
.cal button.today{color:var(--accent)}
.cal i{width:5px;height:5px;border-radius:50%}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:8px;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--grad);border-radius:5px}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-child{border-top:0}
.log-sets{font-size:13px;color:var(--muted);margin-top:8px;display:flex;flex-direction:column;gap:6px}
.log-sets b{color:var(--text);font-weight:500}

/* settings */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set-item:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stp-grid{margin-bottom:2px}.stp-f{display:flex;flex-direction:column;align-items:center;gap:8px}.stp-l{font-size:13px;font-weight:700;color:var(--muted)}
.stp{display:flex;align-items:stretch;width:100%;height:52px;border-radius:16px;background:var(--lg-bg,var(--surface2));border:1px solid var(--lg-brd,var(--line));box-shadow:inset 0 1px 0 var(--lg-hi,transparent);overflow:hidden}
.stp button{width:48px;flex:none;font-size:24px;font-weight:600;color:var(--accent);transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.stp button:active{background:var(--accent-soft);transform:scale(.92)}.stp button:disabled{opacity:.3}
.stp .num{flex:1;display:grid;place-items:center;font-size:22px;font-weight:800;border-left:1px solid var(--line);border-right:1px solid var(--line);color:var(--text)}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--surface2);font-size:18px;font-weight:700;color:var(--text)}
.stepper .num{min-width:56px;text-align:center;font-size:20px}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--grad)}
.toggle.on::after{transform:translateX(20px)}
textarea{width:100%;min-height:120px;background:var(--surface2);border:0;border-radius:14px;color:var(--text);padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.themes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted);border:2px solid transparent}
.themes button.on{border-color:var(--accent);color:var(--text)}
.themes i{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

/* session */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top)}
.sess-top{flex:none;background:var(--bg)}
.sess-top .in{max-width:520px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--surface);border-radius:16px;padding:6px 0;box-shadow:var(--shadow-sm)}
.stats small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.stats .num{font-size:17px;line-height:1.2}
.sess-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sess-body .in{max-width:520px;margin:0 auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 200px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.progress-dots{display:flex;gap:5px}
.progress-dots i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.progress-dots i.done{background:var(--ok)}
.progress-dots i.cur{background:var(--grad)}
.ex-title{font-size:26px;font-weight:700;line-height:1.25;text-wrap:balance}
.pr-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.pr-row .num{font-size:28px;line-height:1}
.spark{width:100%;height:56px;display:block}
.warm{border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-sm);padding:14px 16px}
.warm summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
.warm summary::-webkit-details-marker{display:none}
.warm ol{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.warm li{background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.warm li .num{color:var(--text);font-size:17px}
.target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.target .num{font-size:20px;color:var(--text)}
.sets{display:flex;flex-direction:column;gap:10px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 58px;gap:8px;align-items:stretch;background:var(--surface);border-radius:20px;padding:8px;box-shadow:var(--shadow-sm);transition:background .2s}
.set-n{display:grid;place-items:center;font-family:var(--f-num);font-size:17px;color:var(--faint);font-weight:800}
.fld{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--surface2);border-radius:14px;padding:6px 4px;min-width:0}
.fld .in-row{display:flex;align-items:baseline;justify-content:center;gap:3px;width:100%}
.fld input{width:100%;max-width:90px;text-align:center;background:none;border:0;outline:0;font-family:var(--f-num);font-size:28px;font-weight:800;padding:0;line-height:1.15;min-width:0}
.fld input::placeholder{color:var(--faint)}
.fld .u{font-size:12px;color:var(--muted);flex:none}
.fld small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chk{border-radius:14px;display:grid;place-items:center;background:var(--surface2);color:var(--faint)}
.chk svg{width:26px;height:26px}
.set.done{background:var(--accent-soft);box-shadow:none}
.set.done .fld{background:var(--surface)}
.set.done .chk{background:var(--grad);color:var(--on-accent);box-shadow:0 6px 14px -6px var(--accent)}
.set.done .set-n{color:var(--accent)}
.sess-foot{flex:none;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.sess-foot .in{max-width:520px;margin:0 auto;padding:10px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.sess-foot .btn{flex:1;height:52px;border-radius:16px}

/* rest timer */
.rest{position:fixed;left:0;right:0;z-index:45;bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.rest .in{max-width:492px;margin:0 auto;background:var(--grad);color:var(--on-accent);border-radius:24px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 36px -10px var(--accent)}
.rest .ring{width:56px;height:56px;flex:none;position:relative}
.rest .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.rest .clock{font-family:var(--f-num);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rest small{display:block;font-size:12px;font-weight:700;opacity:.85}
.rest .rb{height:36px;min-width:42px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.22);font-weight:700;font-size:13px;color:var(--on-accent)}
.rest .rb.go{background:#fff;color:#2B2540}
.rest.over .in{background:linear-gradient(135deg,var(--ok),#7BD9C0)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:calc(100% - var(--top) - 12px);background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px max(20px,env(safe-area-inset-left,0px))}
.sheet-b{overflow-y:auto;padding:4px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-b>*{flex-shrink:0}
.sheet .card,.sheet .tile{box-shadow:var(--shadow-sm)}
.thumb{width:58px;height:46px;border-radius:13px;background:#fff;overflow:hidden;flex:none;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.ph{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px}
.thumb.sm{width:36px;height:28px;border-radius:9px}
.thumb.cur{box-shadow:0 0 0 2px var(--accent)}
.verdict{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.verdict:first-child{border-top:0}
.vtag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.vtag.up{background:var(--accent-soft);color:var(--accent)}.vtag.hold{background:var(--surface2);color:var(--muted)}.vtag.down{background:var(--danger-soft);color:var(--danger)}
.sheet-f{padding:12px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.sheet-f .btn{flex:1;height:52px;border-radius:16px}
.dialog{position:fixed;inset:0;z-index:90;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px}
.dialog .box{background:var(--surface);border-radius:24px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog .row .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{height:48px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line2);padding:0 14px;outline:0;width:100%}
.field input:focus,.field select:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(12px + var(--top));transform:translateX(-50%);z-index:100;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px);animation:fade .2s ease}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ok)}

/* names, demos, tutorials */
.en{font-family:var(--f-num);font-size:12px;letter-spacing:.01em;color:var(--faint);font-weight:600;line-height:1.3}
.demo{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:16px;overflow:hidden;background:#fff}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img.b{animation:flip 2.4s steps(1,end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.demo .approx{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(43,37,64,.72);color:#fff;padding:2px 7px;border-radius:7px}
.tut{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.tut summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
.tut summary::-webkit-details-marker{display:none}
.tut-grid{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
.cues{margin:0;padding:0 0 0 18px;font-size:13px;line-height:1.55;color:var(--text);display:flex;flex-direction:column;gap:4px}
.cues li::marker{color:var(--accent);font-family:var(--f-num);font-weight:800}
.warn{font-size:13px;color:var(--danger);background:var(--danger-soft);border-radius:12px;padding:9px 12px}
.links{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}
/* auth & onboarding */
.full{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.full .wrap{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));width:100%}
.hero-icon{width:76px;height:76px;border-radius:22px;box-shadow:0 14px 30px -12px var(--accent)}
.hero-mark{width:68px;height:68px;border-radius:50%;background:var(--grad);position:relative;box-shadow:0 12px 28px -10px var(--accent)}
.hero-mark::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 5px rgba(255,255,255,.0)}
.lead{font-size:15px;color:var(--muted);margin:0}
.msg{font-size:14px;padding:11px 14px;border-radius:14px;background:var(--surface2)}
.gbtn{background:var(--surface);color:var(--text);box-shadow:var(--shadow);letter-spacing:.02em}.gbtn svg{width:22px;height:22px}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.steps i.on{background:var(--grad)}
.big-q{font-size:26px;font-weight:700;line-height:1.3;text-wrap:balance}
.tiles5{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tiles5 button,.wdpick button{height:74px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);font-family:var(--f-num);font-size:30px;font-weight:800;color:var(--text)}
.tiles5 button small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.tiles5 button.on,.wdpick button.on{background:var(--grad);color:var(--on-accent);box-shadow:0 8px 18px -8px var(--accent)}
.tiles5 button.on small{color:var(--on-accent)}
.wdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdpick button{height:58px;font-family:var(--f-body);font-size:15px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:20px;padding:15px 17px;box-shadow:var(--shadow-sm);color:var(--text)}
.opt.on{border-color:var(--accent);background:linear-gradient(140deg,var(--accent-soft),var(--surface) 70%)}
.opt b{display:block;font-size:16px}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt .days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{position:relative}
.opt .badge{position:absolute;top:12px;right:14px;display:inline-block;margin:0;padding:3px 9px;border-radius:999px;background:var(--grad);color:var(--on-accent);font-size:11px;font-weight:700}
.lead .who{display:inline-block;margin:2px 4px 0 0;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.rec-prev{display:flex;flex-direction:column;gap:10px;margin:-2px 0 4px;animation:rise .45s cubic-bezier(.22,1,.36,1)}
.rp-day{background:var(--lg-bg);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 0 0 1px var(--lg-brd),var(--lg-sh);border-radius:18px;padding:10px 12px 6px}
.rp-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.rp-h b{font-size:15px}.rp-h span{font-size:12px;color:var(--muted);font-weight:700}
.rp-ex{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.rp-ex:nth-child(2){border-top:0}
.rp-n{font-size:14px;font-weight:700}
.rp-main{font-style:normal;margin-left:6px;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px;white-space:nowrap}
.rp-s{font-size:13px;color:var(--text);white-space:nowrap}

.ex-head{display:flex;gap:12px;align-items:flex-start}
.trend{flex:none;width:42%;max-width:190px;background:var(--surface);border-radius:16px;padding:8px 10px 6px;box-shadow:var(--shadow-sm)}
.trend .spark{height:48px}
.trend small{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted)}
.trend small b{color:var(--text);font-family:var(--f-num);font-weight:800}
.trend.empty{display:grid;place-items:center;min-height:72px;text-align:center;font-size:12px;color:var(--muted)}
.crown{display:inline-grid;color:#F2B33D;vertical-align:-2px;margin-right:2px}
.crown svg{width:14px;height:14px}
.crown.big svg{width:24px;height:24px}
.set-n{flex-direction:column;gap:0;line-height:1}
.gauge{position:relative;height:12px;border-radius:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;overflow:visible;margin:22px 0 6px}
.gauge i{display:block;height:100%;background:var(--accent);opacity:.18}
.gauge i:first-child{border-radius:6px 0 0 6px}.gauge i:last-child{border-radius:0 6px 6px 0}
.gauge i.mid{opacity:.4}
.gauge .me{position:absolute;top:-22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;color:var(--accent);white-space:nowrap}
.gauge .me::after{content:"";width:3px;height:30px;border-radius:2px;background:var(--grad);margin-top:2px}
.glabels{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;font-size:10px;color:var(--muted);text-align:center}
.codebox{font-family:var(--f-num);font-weight:800;font-size:40px;letter-spacing:.18em;text-align:center;padding:14px 8px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);user-select:all;-webkit-user-select:all}
#codeIn{text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-num);font-weight:800;font-size:22px;text-align:center}
.eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eqgrid .opt{padding:12px 14px}
.eqgrid.sm .opt{padding:10px 12px;text-align:center}
.eqgrid.sm .opt b{font-size:14px}
.eqchips{display:flex;gap:6px;flex-wrap:wrap}
.eqchips button{height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;gap:4px}
.eqchips button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.eqchips .lbl{font-size:12px;color:var(--muted);font-weight:700;align-self:center;margin-right:2px}
.bodymap{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:10px 8px 4px;position:relative}
.bodymap svg{width:100%;height:auto;display:block;max-height:62vh}
.bodymap .side{position:absolute;left:10px;top:10px;width:120px}
.bm-base{fill:var(--surface);stroke:var(--line2);stroke-width:1.5}
.bm-mus{fill:var(--accent);opacity:.2;transition:opacity .15s}
.bm-mus.on{opacity:.9}
.bm-hit{cursor:pointer}
.bm-hit:hover .bm-mus{opacity:.45}
.bm-hit:hover .bm-mus.on{opacity:.9}
.bm-lbl{font-family:var(--f-body);font-size:14px;font-weight:700;fill:var(--text)}
.bm-lbl.on{fill:var(--accent)}
.bm-line{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3;fill:none}
.bm-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.demo{background:#fff}
[data-theme="soft"] .thumb img,[data-theme="peach"] .thumb img{mix-blend-mode:multiply}
.demo img:not(.b){animation:flipA 2.4s steps(1,end) infinite}
@keyframes flipA{0%{opacity:1}50%{opacity:0}}
[data-theme="soft"] .thumb,[data-theme="peach"] .thumb{background:var(--surface2)}
.demo img{object-fit:cover}
.dnd-row{gap:8px}
.dnd-h{width:28px;height:40px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab;flex:none}
.dnd-h svg{width:18px;height:18px}
.dnd-row.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;transition:none}
.chk.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.haptic{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.bw-row{display:flex;gap:8px}
.bw-row input{flex:1;min-width:0;height:48px;border-radius:14px;background:var(--surface2);border:0;padding:0 14px;font-family:var(--f-num);font-weight:800;font-size:20px;outline:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;position:relative;border-radius:16px;overflow:hidden;background:var(--surface2);aspect-ratio:3/4;max-width:100%}
.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.cmp figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(20,14,40,.7));color:#fff;font-size:12px;font-weight:700}
.cmp figcaption b{font-family:var(--f-num);font-size:18px;display:block}
.cmp .tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);color:#2B2540;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid button{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface2);max-width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid span{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(20,14,40,.65));padding:10px 4px 3px;text-align:center}
.pgrid .add{display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);font-size:12px;font-weight:700}
.pgrid .add svg{width:22px;height:22px}
.diff{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--muted)}
.diff b{font-family:var(--f-num);font-size:18px;color:var(--text)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
/* ===== liquid glass ===== */
:root,[data-theme="soft"]{--lg-bg:rgba(255,255,255,.58);--lg-brd:rgba(255,255,255,.85);--lg-hi:rgba(255,255,255,.95);--lg-edge:rgba(120,100,190,.10);--lg-sh:0 10px 30px -8px rgba(70,50,140,.16);--blob1:rgba(139,124,246,.30);--blob2:rgba(242,156,192,.28);--blob3:rgba(120,190,255,.20)}
[data-theme="peach"]{--lg-bg:rgba(255,255,255,.6);--lg-brd:rgba(255,255,255,.85);--lg-hi:rgba(255,255,255,.95);--lg-edge:rgba(190,110,80,.10);--lg-sh:0 10px 30px -8px rgba(140,70,40,.16);--blob1:rgba(240,134,106,.26);--blob2:rgba(245,191,115,.28);--blob3:rgba(250,150,180,.18)}
[data-theme="night"]{--lg-bg:rgba(38,34,54,.52);--lg-brd:rgba(255,255,255,.09);--lg-hi:rgba(255,255,255,.16);--lg-edge:rgba(0,0,0,.3);--lg-sh:0 14px 36px -10px rgba(0,0,0,.6);--blob1:rgba(167,151,255,.24);--blob2:rgba(245,155,196,.18);--blob3:rgba(90,140,255,.16)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:
 radial-gradient(38% 30% at 12% 18%,var(--blob1),transparent 70%),
 radial-gradient(34% 28% at 92% 38%,var(--blob2),transparent 70%),
 radial-gradient(40% 30% at 30% 88%,var(--blob3),transparent 70%);filter:blur(10px);animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,-4%,0) scale(1.06)}}
.card,.tile,.tut,.trend,.warm,.stats,.search,.set,.opt,.seg,.bodymap,.codebox,.chips button,.eqchips button,.tiles5 button,.wdpick button,.dialog .box{
 background:var(--lg-bg);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
 box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 0 0 1px var(--lg-brd),inset 0 -1px 0 var(--lg-edge),var(--lg-sh)}
.seg button.on{background:var(--surface);box-shadow:0 3px 10px -2px rgba(40,20,90,.18),inset 0 1px 0 var(--lg-hi)}
.chips button.on,.eqchips button.on{box-shadow:0 6px 16px -6px var(--accent)}
.opt.on,.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--lg-sh)}
/* tab bar: floating liquid glass capsule with sliding bubble */
.tabbar .in{position:relative;border-radius:32px;padding:6px;background:var(--lg-bg);-webkit-backdrop-filter:blur(28px) saturate(2) brightness(1.04);backdrop-filter:blur(28px) saturate(2) brightness(1.04);
 box-shadow:inset 0 1px 0 var(--lg-hi),inset 0 0 0 1px var(--lg-brd),inset 0 -8px 16px -10px rgba(255,255,255,.35),0 16px 40px -12px rgba(40,25,90,.28)}
.tabbar .in::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%);mix-blend-mode:soft-light}
.tabbar .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px)/4);border-radius:26px;background:var(--surface);
 box-shadow:inset 0 1px 0 var(--lg-hi),0 6px 16px -6px rgba(60,40,140,.3);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform .55s cubic-bezier(.34,1.45,.5,1)}
[data-theme="night"] .tabbar .pill{background:rgba(255,255,255,.12)}
.tabbar button{position:relative;z-index:1;transition:color .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.tabbar button.on{background:none}
/* sheets: glass, spring in, swipe down */
.sheet{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);box-shadow:inset 0 1px 0 var(--lg-hi),0 -12px 40px rgba(20,10,50,.18);animation:sheetIn .55s cubic-bezier(.2,.95,.25,1);will-change:transform}
.sheet-h{touch-action:none}
.sheet::before{width:38px;height:5px;margin:8px auto 4px;background:color-mix(in srgb,var(--muted) 45%,transparent)}
.scrim{animation:fade .3s ease}
.layer-still .sheet,.layer-still .scrim{animation:none}
.closing{pointer-events:none}
.closing.scrim{animation:fadeOut .28s ease forwards}
.sheet-picker{height:calc(100% - var(--top) - 12px)}.sheet-picker .sheet-b{flex:1}
.closing .sheet{animation:sheetOut .3s cubic-bezier(.4,0,.8,.4) forwards}
.closing.dialog{animation:fadeOut .2s ease forwards}
.dialog{animation:fade .2s ease}
.dialog .box{animation:popIn .38s cubic-bezier(.34,1.5,.5,1)}
.layer-still .dialog,.layer-still .dialog .box{animation:none}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popIn{from{transform:scale(.88);opacity:0}}
.toast{background:color-mix(in srgb,var(--text) 78%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:toastIn .45s cubic-bezier(.34,1.5,.5,1)}
@keyframes toastIn{from{transform:translate(-50%,-16px) scale(.9);opacity:0}}
.rest .in{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.18),0 18px 40px -12px var(--accent);animation:sheetIn .5s cubic-bezier(.2,.95,.25,1)}

const Cloud={status:'local',chain:Promise.resolve(),timer:null,hadRemote:false,
  async pull(){
    if(!DB||!user) return;

      const [d,ls]=await Promise.all([userDoc().get(),userDoc().collection('logs').orderBy('end','desc').limit(3000).get()]);
      const remote=d.exists&&d.data().json?JSON.parse(d.data().json):null;this.hadRemote=!!remote;

      else if(state.updatedAt) this.queueState(true);
      const rl=ls.docs.map(x=>{try{return JSON.parse(x.data().json)}catch(e){return null}}).filter(Boolean);
      const ids=new Set(rl.map(l=>l.id));const localOnly=logs.filter(l=>!ids.has(l.id));
      logs=[...rl,...localOnly].sort((a,b)=>b.end-a.end);saveLogs();
      localOnly.forEach(l=>this.putLog(l));

  },
  run(fn){this.chain=this.chain.then(fn).then(()=>{this.status='cloud'}).catch(()=>{this.status='offline'})},
  queueState(now){

const allEx=()=>BASE_EX.concat((state&&state.customEx)||[]);

const EX=id=>EXMAP[id]||{id,name:'未知動作',group:'全身',equip:'器械',compound:false};
const incOf=ex=>INC[ex.equip]||2.5;
// rest: saved per exercise if you changed it; otherwise by load (heavier sets, longer rest), never above the defaults in Settings
const restByReps=r=>r<=6?120:r<=10?90:r<=15?75:60;
const restOf=(exId,rmax)=>{if(state.restByEx[exId]!=null)return state.restByEx[exId];const ex=EX(exId);if(ex.group==='有氧')return 60;
  const cap=ex.compound?state.settings.restCompound:state.settings.restIso;return Math.min(cap,rmax?restByReps(rmax):(ex.compound?120:75))};
function phaseAt(date){
  if(!state.settings.periodize) return {idx:-1,cycle:0,week:0};
  const w=Math.max(0,Math.floor(between(state.settings.cycleStart,date)/7));
  return {idx:w%5,cycle:Math.floor(w/5)+1,week:w%5+1};
}
function prescribe(pe,ph){
  const ex=EX(pe.exId),inc=incOf(ex);
  const sets=Math.max(1,Math.round(pe.sets*ph.setsF));
  const rmin=Math.max(1,Math.round(pe.repMin*ph.repF));
  const rmax=Math.max(rmin,Math.round(pe.repMax*ph.repF));
  const w=pe.weight>0?Math.max(inc,roundTo(pe.weight*ph.mult,inc)):0;
  return {sets,rmin,rmax,w};
}
function rotIdx(date){const P=state.plan,n=P.days.length;if(!n)return 0;const w=Math.floor(between(P.start||mondayOf(TODAY()),date)/7);return ((w%n)+n)%n}
function dayFor(date){
  const ov=state.overrides[date];
  const P=state.plan;let day;
  if(ov) day=P.days.find(d=>d.id===ov.dayId);
  else if(P.rotate){day=P.days.length&&P.days[0].wd===pd(date).getDay()?P.days[rotIdx(date)]:null}
  else day=P.days.find(d=>d.wd===pd(date).getDay());
  if(!day) return null;
  return {day,exercises:ov&&ov.exercises?ov.exercises:day.exercises,ov};
}
function lastSets(exId,beforeEnd){
  for(const l of logs){ if(beforeEnd&&l.end>=beforeEnd) continue; const it=l.items.find(i=>i.exId===exId); if(it&&it.sets.length) return it.sets }
  return null;
}
function history(exId){
  const out=[];
  for(const l of logs){const it=l.items.find(i=>i.exId===exId);if(it&&it.sets.length){const top=it.sets.reduce((a,s)=>s.w>a.w||(s.w===a.w&&s.r>a.r)?s:a,it.sets[0]);out.push({date:l.date,end:l.end,top,sets:it.sets,best1:Math.max(...it.sets.map(s=>e1rm(s.w,s.r)))})}}
  return out.sort((a,b)=>a.end-b.end);
}
function bestOf(exId){const h=history(exId);if(!h.length)return null;return h.reduce((a,x)=>x.top.w>a.top.w||(x.top.w===a.top.w&&x.top.r>a.top.r)?x:a,h[0])}

/* ---------- Session ---------- */
function sessionTotals(){let v=0,r=0;state.active.items.forEach(it=>{const c=EX(it.exId).group==='有氧';it.sets.forEach(s=>{if(s.done&&!c){v+=(+s.w||0)*(+s.r||0);r+=+s.r||0}})});return {v,r}}
function renderSession(){
  const a=state.active,it=a.items[a.idx],P=PH(a.phaseIdx);
  const tot=sessionTotals();
  let body='';
  if(!it){body='<div class="empty">今天沒有動作，按「調整」新增一個</div>'}
  else{
    const ex=EX(it.exId),best=bestOf(it.exId),h=history(it.exId).slice(-16),last=lastSets(it.exId);
    const allDone=it.sets.length&&it.sets.every(s=>s.done);
    body+=`<div class="progress-dots">${a.items.map((x,i)=>`<i class="${x.sets.length&&x.sets.every(s=>s.done)?'done':i===a.idx?'cur':''}"></i>`).join('')}</div>
    <div class="ex-head"><div class="grow"><div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:wrap"><span class="chip ph">${P.name}</span>${musclesOf(ex).map(m=>`<span class="chip">${MUS[m]}</span>`).join('')}</div>
     <div class="ex-title">${esc(ex.name)}</div>${ex.en?`<div class="en" style="font-size:14px;margin-top:2px">${esc(ex.en)}</div>`:''}</div>${trendHTML(it.exId)}</div>`;
    body+=tutHTML(ex);
    if(ex.compound&&it.sugg>=30&&['槓鈴','史密斯'].includes(ex.equip)){
      const bar=ex.equip==='槓鈴'?20:15,inc=incOf(ex),W=it.sugg;
      const steps=[[bar,10,'空槓'],[Math.max(bar,roundTo(W*.5,inc)),5,'輕'],[Math.max(bar,roundTo(W*.7,inc)),3,'中'],[Math.max(bar,roundTo(W*.85,inc)),1,'中重']];
      body+=`<details class="warm" ${it.warm?'':'open'}><summary><span>${it.warm?'✓ 熱身完成':'熱身組'}</span><span class="muted" style="font-size:13px">${it.warm?'展開':'依今天重量計算'}</span></summary>
       <ol>${steps.map(([w,r,l])=>`<li><span class="num">${fw(w)}</span> kg × ${r}　${l}</li>`).join('')}</ol>
       ${it.warm?'':`<button class="btn sm" style="margin-top:10px;width:100%" data-act="warmDone">熱身完成</button>`}</details>`;
    }
    body+=`<div class="target"><span>目標</span><span class="num">${it.sets.length}</span>組 ×<span class="num">${it.rmin===it.rmax?it.rmin:it.rmin+'-'+it.rmax}</span>次 <span class="grow"></span><button class="btn sm ghost" data-act="restEdit" data-ex="${it.exId}">${ICON.timer}休息 ${mmss(restOf(it.exId,it.rmax))}</button></div>
    <div class="sets">${it.sets.map((s,i)=>{const ls=last&&(last[i]||last[last.length-1]);
      return `<div class="set ${s.done?'done':''}" data-i="${i}"><div class="set-n">${s.done&&s.pr?`<span class="crown" title="${s.pr==='w'?'重量新高':'這個重量次數新高'}">${ICON.crown}</span>`:''}${i+1}</div>
       <label class="fld"><span class="in-row"><input inputmode="decimal" data-f="w" data-i="${i}" value="${s.w===''?'':fw(s.w)}" placeholder="0" aria-label="第${i+1}組重量"><span class="u">${ex.wunit||'kg'}</span></span><small>${ls?'上次 '+fw(ls.w):'建議 '+fw(it.sugg)}</small></label>
       <label class="fld"><span class="in-row"><input inputmode="numeric" data-f="r" data-i="${i}" value="${esc(s.r)}" placeholder="${it.rmax}" aria-label="第${i+1}組次數"><span class="u">${ex.unit||'次'}</span></span><small>${ls?'上次 '+ls.r:'目標 '+(it.rmin===it.rmax?it.rmin:it.rmin+'-'+it.rmax)}</small></label>
       <button class="chk" data-act="setDone" data-i="${i}" aria-label="完成第${i+1}組">${ICON.check}</button></div>`}).join('')}</div>
    <div class="row"><button class="btn sm" data-act="addSet">${ICON.plus}加一組</button>${it.sets.length>1?'<button class="btn sm ghost" data-act="rmSet">減一組</button>':''}<span class="grow"></span><button class="btn sm" data-act="customizeSess">${ICON.edit}調整動作</button></div>
    ${allDone?strengthHTML(it):''}
    ${allDone&&a.idx<a.items.length-1?`<div class="muted" style="font-size:13px;text-align:center">下一個：${esc(EX(a.items[a.idx+1].exId).name)}</div>`:''}`;
  }
  const isLast=a.idx>=a.items.length-1;
  return `<div class="sess">
   <div class="sess-top"><div class="in"><button class="btn sm" data-act="exitSess">離開</button>
    <div class="stats"><div><small>時間</small><div class="num" id="sessClock">${hms(Date.now()-a.startedAt)}</div></div><div><small>總量 kg</small><div class="num">${kfmt(tot.v)}</div></div><div><small>次數</small><div class="num">${tot.r}</div></div></div>
    <button class="btn sm" data-act="exList">${a.idx+1}/${a.items.length}</button></div></div>
   <div class="sess-body" id="sessBody"><div class="in">${body}</div></div>
   <div class="sess-foot"><div class="in"><button class="btn" data-act="prevEx" ${a.idx===0?'disabled style="opacity:.4"':''}>${ICON.left}上一個</button>
    ${isLast?'<button class="btn primary" data-act="finish">完成訓練</button>':`<button class="btn primary" data-act="nextEx">下一個${ICON.right}</button>`}</div></div>
   ${renderRest()}
  </div>`;
}
function sparkSVG(vals){
  if(vals.length<2) return '<div></div>';
  const W=200,H=56,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(W-8)+4,H-6-(v-mn)/rg*(H-14)]);
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="重量趨勢"><polygon points="4,${H} ${line} ${W-4},${H}" fill="var(--phase-soft)"/><polyline points="${line}" fill="none" stroke="var(--phase)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--phase)"/></svg>`;
}
function renderRest(){
  const r=state.active&&state.active.rest;if(!r) return '';
  const left=(r.endAt-Date.now())/1000,over=left<=0;
  const C=2*Math.PI*24,frac=Math.max(0,Math.min(1,left/r.total));
  return `<div class="rest ${over?'over':''}" id="rest"><div class="in">
   <div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="5"/><circle id="restArc" cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg></div>
   <div class="grow"><small id="restLbl">${over?'休息結束，開始下一組':'休息中'}</small><div class="clock" id="restClock">${over?'+'+mmss(-left):mmss(left)}</div></div>
   <button class="rb" data-act="restAdd" data-d="-15">−15</button><button class="rb" data-act="restAdd" data-d="15">+15</button><button class="rb go" data-act="restSkip">${over?'關閉':'跳過'}</button></div></div>`;
}

/* ---------- rest timer & audio ---------- */
let actx=null;
function unlockAudio(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(state.settings.vibrate){try{if(navigator.vibrate)navigator.vibrate([200,100,200]);else{haptic();setTimeout(haptic,180);setTimeout(haptic,360)}}catch(e){}}
  if(!state.settings.sound||!actx) return;
  try{[0,.28,.56].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain(),T0=actx.currentTime+t;o.type='sine';o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,T0);g.gain.exponentialRampToValueAtTime(.35,T0+.02);g.gain.exponentialRampToValueAtTime(.0001,T0+.22);o.connect(g).connect(actx.destination);o.start(T0);o.stop(T0+.25)})}catch(e){}
}
// iOS Safari has no vibration API; toggling a hidden switch checkbox gives a light haptic tap on iOS 18+
function haptic(){
  try{if(navigator.vibrate){navigator.vibrate(30);return}}catch(e){}
  try{let l=document.getElementById('hapticLbl');if(!l){l=document.createElement('label');l.id='hapticLbl';l.className='haptic';l.innerHTML='<input type="checkbox" switch>';document.body.appendChild(l)}l.click()}catch(e){}
}
function tick(){
  if(!state.settings.sound||!actx) return;
  try{const o=actx.createOscillator(),g=actx.createGain(),T0=actx.currentTime;o.type='triangle';o.frequency.setValueAtTime(660,T0);o.frequency.exponentialRampToValueAtTime(990,T0+.08);
    g.gain.setValueAtTime(.0001,T0);g.gain.exponentialRampToValueAtTime(.25,T0+.015);g.gain.exponentialRampToValueAtTime(.0001,T0+.16);o.connect(g).connect(actx.destination);o.start(T0);o.stop(T0+.18)}catch(e){}
}
function startRest(exId,rmax){const sec=restOf(exId,rmax);state.active.rest={endAt:Date.now()+sec*1000,total:sec,exId,beeped:false}}
setInterval(()=>{
  if(!state.active) return;
  const c=document.getElementById('sessClock')||document.getElementById('bannerClock');
  if(c) c.textContent=hms(Date.now()-state.active.startedAt);
  const r=state.active.rest;if(!r) return;
  const left=(r.endAt-Date.now())/1000;
  if(left<=0&&!r.beeped){r.beeped=true;beep();save();if(ui.inSession) rerenderSession();return}
  const el=document.getElementById('restClock');
  if(el){el.textContent=left<=0?'+'+mmss(-left):mmss(left);
    const arc=document.getElementById('restArc');if(arc){const C=2*Math.PI*24;arc.setAttribute('stroke-dashoffset',C*(1-Math.max(0,Math.min(1,left/r.total))))}}
  if(left<-600){state.active.rest=null;save();if(ui.inSession)rerenderSession()}
},250);
let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.active&&ui.inSession)keepAwake()});

/* ---------- sessions ---------- */
function makeItem(pe,P){
  const p=prescribe(pe,P),last=lastSets(pe.exId);
  const sugg=p.w||(last?last[0].w:0);
  return {key:uid(),exId:pe.exId,peId:pe.id,rmin:p.rmin,rmax:p.rmax,sugg,warm:false,sets:Array.from({length:p.sets},()=>({w:sugg,r:'',done:false}))};
}
function startSession(date){
  const r=dayFor(date);if(!r) return;
  const ph=phaseAt(TODAY()),P=PH(ph.idx);
  state.active={id:uid(),date:TODAY(),planDate:date,dayId:r.day.id,dayName:r.day.name,phaseIdx:ph.idx,cycle:ph.cycle,startedAt:Date.now(),idx:0,items:r.exercises.map(pe=>makeItem(pe,P)),rest:null};
  ui.inSession=true;save();keepAwake();render();
}
function sessionEnd(a){
  const now=Date.now();if(now-a.startedAt<6*36e5) return now;
  let last=0;a.items.forEach(it=>it.sets.forEach(s=>{if(s.done&&s.at)last=Math.max(last,s.at)}));
  return last?Math.min(now,last+2*6e4):a.startedAt+60*6e4;
}
function finishSession(){
  const a=state.active;
  const items=a.items.map(it=>({exId:it.exId,sets:it.sets.filter(s=>s.done).map(s=>Object.assign({w:+s.w||0,r:+s.r||0},s.pr?{pr:s.pr}:{}))})).filter(it=>it.sets.length);
  if(!items.length){ui.dialog={title:'還沒有完成任何一組',msg:'要直接放棄這次訓練嗎？不會留下紀錄。',ok:'放棄訓練',danger:true,onOk:()=>{state.active=null;ui.inSession=false;save();render()}};render();return}
  const volume=items.reduce((t,it)=>t+(EX(it.exId).group==='有氧'?0:it.sets.reduce((x,s)=>x+s.w*s.r,0)),0);
  const reps=items.reduce((t,it)=>t+it.sets.reduce((x,s)=>x+s.r,0),0);
  const log={id:uid(),date:a.date,dayName:a.dayName,phaseIdx:a.phaseIdx,cycle:a.cycle,start:a.startedAt,end:sessionEnd(a),items,volume,reps};
  // PRs vs previous history
  const prs=[];items.forEach(it=>{const w=it.sets.filter(x=>x.pr==='w');const r=it.sets.filter(x=>x.pr==='r');
    if(w.length){const top=w.reduce((a,x)=>x.w>a.w?x:a,w[0]);prs.push({exId:it.exId,text:`重量新高 ${fw(top.w)} kg × ${top.r}`})}
    else if(r.length){const top=r.reduce((a,x)=>x.r>a.r?x:a,r[0]);prs.push({exId:it.exId,text:`${fw(top.w)} kg 做了 ${top.r} 下，次數新高`})}});
  const ups=progress(a);
  logs.unshift(log);saveLogs();Cloud.putLog(log);
  state.active=null;ui.inSession=false;save();
  ui.sheet={type:'summary',log,prs,ups};render();
}

/* ---------- layer: sheets & dialogs ---------- */
function renderLayer(){
  const L=document.getElementById('layer');let h='';
  const s=ui.sheet;
  if(s){
    const fn={photoNew:sheetPhotoNew,photoView:sheetPhotoView,share:sheetShare,shareDone:sheetShareDone,importPreview:sheetImportPreview,profile:sheetProfile,exitSess:sheetExitSess,customize:sheetCustomize,picker:sheetPicker,exDetail:sheetExDetail,plan:sheetPlan,newEx:sheetNewEx,summary:sheetSummary,exList:sheetExList,restEdit:sheetRestEdit}[s.type];
    h+=`<div class="scrim" data-act="scrim"><div class="sheet sheet-${s.type}" role="dialog" aria-modal="true">${fn(s)}</div></div>`;
  }
  if(ui.dialog){const d=ui.dialog;h+=`<div class="dialog"><div class="box"><h2>${esc(d.title)}</h2><div class="muted">${esc(d.msg)}</div><div class="row"><button class="btn" data-act="dlgNo">取消</button><button class="btn ${d.danger?'danger':'primary'}" data-act="dlgOk">${esc(d.ok)}</button></div></div></div>`}
  const keepScroll=L.querySelector('.sheet-b');const st=keepScroll?keepScroll.scrollTop:0;
  const sk=s?s.type:'',dk=ui.dialog?ui.dialog.title:'';
  const oldScrim=L.querySelector(':scope>.scrim'),oldDlg=L.querySelector(':scope>.dialog');
  if(oldScrim&&!s) ghostOut(oldScrim);
  if(oldDlg&&!ui.dialog) ghostOut(oldDlg);
  L.classList.toggle('layer-still',!!(s&&L.dataset.sk===sk)&&(!ui.dialog||L.dataset.dk===dk));
  const prevSk=L.dataset.sk;
  if(prevSk==='plan'&&sk!=='plan') ui.planScroll=st; // leaving the plan editor (to add/edit an exercise): remember where we were
  L.dataset.sk=sk;L.dataset.dk=dk;
  L.innerHTML=h;
  const nb=L.querySelector('.sheet-b');if(nb&&ui.keepSheetScroll){nb.scrollTop=st;ui.keepSheetScroll=false}
  else if(nb&&sk==='plan'&&prevSk!=='plan'&&ui.planScroll){nb.scrollTop=ui.planScroll}
}
function ghostOut(el){
  const g=el.cloneNode(true);g.classList.add('closing');const b=el.querySelector('.sheet-b'),gb=g.querySelector('.sheet-b');
  document.body.appendChild(g);if(b&&gb)gb.scrollTop=b.scrollTop;setTimeout(()=>g.remove(),320);
}

/* ---------- customize logic ---------- */
function openCustomize({mode,date,peId,isNew,dayId}){
  let pe,dayName,phaseIdx,dId;
  if(mode==='session'){
    const a=state.active,it=a.items[a.idx];
    dId=a.dayId;dayName=a.dayName;phaseIdx=a.phaseIdx;
    if(isNew) pe={id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0};
    else{const planPe=(state.plan.days.find(d=>d.id===a.dayId)||{exercises:[]}).exercises.find(x=>x.id===it.peId);
      pe=planPe?clone(planPe):{id:it.peId||uid(),exId:it.exId,sets:it.sets.length,repMin:it.rmin,repMax:it.rmax,weight:it.sugg};
      pe.exId=it.exId;pe.sets=it.sets.length;}
  }else if(mode==='plan'){
    const d=PT().days.find(x=>x.id===dayId);dId=d.id;dayName=d.name;phaseIdx=0;
    pe=isNew?{id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0}:clone(d.exercises.find(x=>x.id===peId));
  }else{
    const r=dayFor(date);dId=r.day.id;dayName=r.day.name;phaseIdx=phaseAt(date).idx;
    pe=isNew?{id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0}:clone(r.exercises.find(x=>x.id===peId));
  }
  const draft={...pe,rest:pe.exId?restOf(pe.exId):90};
  ui.sheet={type:'customize',mode,date,dayId:dId,dayName,phaseIdx,draft,isNew:!!isNew,origExId:pe.exId,scope:mode==='plan'?'plan':'today'};
  if(isNew){ui.sheet.type='picker';ui.sheet.after='custom';ui.pending={...ui.sheet,type:'customize'}}
  render();
}
function czApply(del){
  const s=ui.sheet,d=s.draft;
  if(!d.exId){toast('請先選擇動作');return}
  d.sets=Math.max(1,Math.min(12,parseInt(d.sets)||1));d.repMin=Math.max(1,parseInt(d.repMin)||1);d.repMax=Math.max(d.repMin,parseInt(d.repMax)||d.repMin);d.weight=Math.max(0,parseFloat(d.weight)||0);
  if(d.rest!==restOf(d.exId)||state.restByEx[d.exId]!=null) state.restByEx[d.exId]=d.rest;
  const pe={id:d.id,exId:d.exId,sets:d.sets,repMin:d.repMin,repMax:d.repMax,weight:d.weight};
  const applyList=(list)=>{const i=list.findIndex(x=>x.id===pe.id);if(del){if(i>=0)list.splice(i,1)}else if(i>=0)list[i]=clone(pe);else list.push(clone(pe))};
  const planDay=(s.mode==='plan'?PT():state.plan).days.find(x=>x.id===s.dayId);
  if(s.mode==='plan'){applyList(planDay.exercises)}
  else if(s.mode==='preview'){
    if(s.scope==='plan'){applyList(planDay.exercises);const ov=state.overrides[s.date];if(ov&&ov.exercises)applyList(ov.exercises)}
    else{const ov=state.overrides[s.date]||(state.overrides[s.date]={dayId:s.dayId,exercises:null});if(!ov.exercises)ov.exercises=clone(planDay.exercises);applyList(ov.exercises)}
  }else{
    const a=state.active,P=PH(a.phaseIdx);
    if(s.scope==='plan'&&planDay) applyList(planDay.exercises);
    if(del){a.items.splice(a.idx,1);a.idx=Math.max(0,Math.min(a.idx,a.items.length-1))}
    else if(s.isNew){a.items.push(makeItem(pe,P));a.idx=a.items.length-1}
    else{const it=a.items[a.idx],p=prescribe(pe,P);const changedEx=it.exId!==pe.exId;
      it.exId=pe.exId;it.peId=pe.id;it.rmin=p.rmin;it.rmax=p.rmax;const ns=p.w||it.sugg;
      if(changedEx){Object.assign(it,makeItem(pe,P),{key:it.key})}
      else{if(ns!==it.sugg){it.sets.forEach(x=>{if(!x.done)x.w=ns})}it.sugg=ns;
        while(it.sets.length<pe.sets)it.sets.push({w:ns,r:'',done:false});
        while(it.sets.length>pe.sets&&!it.sets[it.sets.length-1].done)it.sets.pop();}
    }
  }
  pruneOverrides();
  const back=s.mode==='plan';
  ui.sheet=back?{type:'plan'}:null;save();render();
  toast(del?'已刪除':s.mode==='plan'&&ui.draftPlan?'已更新':s.scope==='plan'||s.mode==='plan'?'已更新計畫':'已更新今天的菜單');
}
function pruneOverrides(){const t=TODAY();for(const k in state.overrides) if(k<addDays(t,-14)) delete state.overrides[k]}

(function(){
  let drag=null;
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.dnd-h');if(!h) return;
    const row=h.closest('.dnd-row'),list=row.parentElement;
    const rows=[...list.querySelectorAll(':scope > .dnd-row')];
    drag={row,list,rows,from:rows.indexOf(row),y0:e.clientY,to:rows.indexOf(row),mids:rows.map(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2}),h:row.getBoundingClientRect().height};
    row.classList.add('dragging');h.setPointerCapture(e.pointerId);e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!drag) return;const dy=e.clientY-drag.y0;drag.row.style.transform=`translateY(${dy}px)`;
    const y=drag.mids[drag.from]+dy;let to=drag.mids.findIndex(m=>y<m);if(to<0)to=drag.rows.length-1;else if(to>drag.from)to--;
    drag.to=Math.max(0,Math.min(drag.rows.length-1,to));
    drag.rows.forEach((r,i)=>{if(r===drag.row)return;let sh=0;if(drag.from<drag.to&&i>drag.from&&i<=drag.to)sh=-drag.h;if(drag.from>drag.to&&i<drag.from&&i>=drag.to)sh=drag.h;r.style.transform=sh?`translateY(${sh}px)`:'';r.style.transition='transform .15s'});
  });
  const end=()=>{
    if(!drag) return;const {list,from,to}=drag;drag.rows.forEach(r=>{r.style.transform='';r.style.transition=''});drag.row.classList.remove('dragging');drag=null;
    if(from===to) return;
    let arr;
    if(list.dataset.dnd==='today'){const date=list.dataset.date,r=dayFor(date);arr=r.ov&&r.ov.exercises?r.ov.exercises:r.day.exercises}
    else{const d=PT().days.find(x=>x.id===list.dataset.day);arr=d.exercises}
    const [m]=arr.splice(from,1);arr.splice(to,0,m);save();ui.keepSheetScroll=true;render();haptic();
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();

/* ---------- plan sharing ---------- */
const PT=()=>ui.draftPlan||state.plan;
const CODE_AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function planPayload(plan,title,periodize){
  const ids=new Set();plan.days.forEach(d=>d.exercises.forEach(e=>ids.add(e.exId)));
  return {v:1,title,periodize:periodize!==false,
    plan:{rotate:!!plan.rotate,days:plan.days.map(d=>({name:d.name,wd:d.wd,exercises:d.exercises.map(e=>({exId:e.exId,sets:e.sets,repMin:e.repMin,repMax:e.repMax}))}))},
    customEx:(state.customEx||[]).filter(e=>ids.has(e.id))};
}
async function publishPlan(plan,title,periodize){
  if(!DB||!user) throw new Error('要先用 Google 登入才能產生代碼（設定 → 帳號）');
  const json=JSON.stringify(planPayload(plan,title,periodize));
  for(let t=0;t<6;t++){
    const code=Array.from({length:6},()=>CODE_AL[Math.floor(Math.random()*CODE_AL.length)]).join('');
    const ref=DB.collection('shared').doc(code);
    const ex=await ref.get();if(ex.exists) continue;
    await ref.set({owner:user.id,title,json,createdAt:Date.now()});
    return code;
  }
  throw new Error('產生代碼失敗，請再試一次');
}
function applyShared(data){
  (data.customEx||[]).forEach(c=>{if(!state.customEx.some(e=>e.id===c.id))state.customEx.push(c)});rebuildEx();
  const P=data.plan;
  state.plan={freq:P.rotate?1:P.days.length,rotate:!!P.rotate,start:mondayOf(TODAY()),days:P.days.map(d=>({id:uid(),name:d.name,wd:d.wd,
    exercises:d.exercises.map(e=>{const last=lastSets(e.exId);return {id:uid(),exId:e.exId,sets:e.sets,repMin:e.repMin,repMax:e.repMax,weight:last?Math.max(...last.map(x=>x.w)):estimateW(e.exId)}})}))};
  state.overrides={};state.settings.periodize=data.periodize!==false;state.settings.cycleStart=mondayOf(TODAY());
}

/* ---------- personal records (crowns) ---------- */
// 'w' = heaviest weight ever for this exercise, 'r' = most reps ever at this exact weight
function prCheck(it,idx){
  if(EX(it.exId).group==='有氧') return null;
  const s=it.sets[idx],w=+s.w||0,r=+s.r||0;let had=false,maxW=0,maxR=-1;
  const scan=x=>{had=true;if(x.w>maxW)maxW=x.w;if(x.w===w&&x.r>maxR)maxR=x.r};
  logs.forEach(l=>l.items.forEach(i=>{if(i.exId===it.exId)i.sets.forEach(x=>scan({w:+x.w,r:+x.r}))}));
  if(!had) return null; // first time doing it: nothing to beat yet
  it.sets.forEach((x,j)=>{if(j!==idx&&x.done)scan({w:+x.w||0,r:+x.r||0})});
  if(w>0&&w>maxW) return 'w';
  if(maxR>=0&&r>maxR) return 'r';
  return null;
}

/* ---------- all-time trend next to the exercise name ---------- */
function trendHTML(exId){
  const h=history(exId);
  if(!h.length) return '<div class="trend empty">第一次做<br>練完就有走勢</div>';
  const best=bestOf(exId);
  if(h.length===1) return `<div class="trend empty"><div>上次 <b class="num" style="font-size:16px;color:var(--text)">${fw(h[0].top.w)}</b> kg × ${h[0].top.r}</div></div>`;
  return `<div class="trend">${sparkSVG(h.map(x=>x.top.w))}<small><span>${h.length} 次</span><span>最高 <b>${fw(best.top.w)}</b> kg</span></small></div>`;
}

/* ---------- strength vs people of similar age / size ----------
   Thresholds = estimated 1RM ÷ body weight for 入門 / 新手 / 中階 / 進階 / 菁英, from published
   strength standards for the main lifts and derived from the novice ratio for the rest.
   Percentile anchors: 5 / 20 / 50 / 80 / 95. */
const STD={bb_squat:[.75,1.25,1.5,2.25,2.75],bb_front_squat:[.6,1,1.25,1.75,2.2],bb_bench:[.5,.75,1,1.5,2],bb_incline:[.4,.65,.85,1.25,1.65],bb_deadlift:[1,1.5,2,2.5,3],bb_sumo_dl:[1,1.5,2,2.5,3],bb_ohp:[.35,.55,.75,1,1.35],bb_row:[.4,.65,.9,1.2,1.5],bb_rdl:[.75,1.1,1.5,2,2.5],bb_hip_thrust:[.75,1.25,1.75,2.5,3.25],bb_curl:[.2,.4,.6,.85,1.15],bb_cgbp:[.45,.7,.95,1.35,1.8]};
function stdFor(exId){
  if(STD[exId]) return STD[exId];
  const r=RATIO[exId]!=null?RATIO[exId]:(()=>{const ex=EX(exId),d=DEF_R[ex.equip]||[.3,.15];return d[ex.compound?0:1]})();
  if(!r) return null;
  const nov=r/.75;return [.5,1,1.35,1.85,2.4].map(k=>+(nov*k).toFixed(3));
}
const LEVELS=['入門','新手','中階','進階','菁英'],PCT=[5,20,50,80,95];
function strengthOf(exId,e1){
  const p=state.profile,ex=EX(exId),std=stdFor(exId);
  if(!p||!p.w||!std||!e1) return null;
  const h=(+p.h||170)/100,bw=Math.min(+p.w,30*h*h);
  const sexF=p.sex==='f'?(UPPER.includes(ex.group)?.6:.72):1;
  const age=+p.age||30,ageF=age<=40?1:Math.max(.55,1-(age-40)*.009);
  const kg=std.map(k=>k*bw*sexF*ageF);
  let pct;
  if(e1<=kg[0]) pct=PCT[0]*e1/kg[0];
  else if(e1>=kg[4]) pct=Math.min(99,95+4*(e1-kg[4])/(kg[4]*.25));
  else{for(let i=0;i<4;i++)if(e1<kg[i+1]){pct=PCT[i]+(PCT[i+1]-PCT[i])*(e1-kg[i])/(kg[i+1]-kg[i]);break}}
  pct=Math.round(pct);const lvl=pct>=95?4:pct>=80?3:pct>=50?2:pct>=20?1:0;
  return {kg,pct,lvl,e1};
}
function strengthHTML(it){
  if(EX(it.exId).group==='有氧') return '';
  const done=it.sets.filter(s=>s.done&&+s.w>0);if(!done.length) return '';
  const e1=Math.max(...done.map(s=>e1rm(+s.w,+s.r||1)));
  const st=strengthOf(it.exId,e1);if(!st) return '';
  const p=state.profile,pos=Math.max(2,Math.min(98,st.pct<=5?st.pct/5*10:st.pct<=20?10+(st.pct-5)/15*20:st.pct<=50?30+(st.pct-20)/30*20:st.pct<=80?50+(st.pct-50)/30*20:st.pct<=95?70+(st.pct-80)/15*20:90+(st.pct-95)/5*10));
  const lo=Math.round(st.kg[1]),hi=Math.round(st.kg[2]);
  return `<div class="card stack"><div class="row between"><div class="ex-name">這個動作的力量評估</div><span class="chip ph" style="background:var(--accent-soft);color:var(--accent)">${LEVELS[st.lvl]}</span></div>
   <div style="font-size:14px">推估最大重量（1RM）<b class="num" style="font-size:20px"> ${Math.round(st.e1)}</b> kg，約贏過 <b class="num" style="font-size:20px">${st.pct}%</b> 同條件的人</div>
   <div><div class="gauge">${LEVELS.map((l,i)=>`<i class="${i===1||i===2?'mid':''}"></i>`).join('')}<span class="me" style="left:${pos}%">你</span></div>
   <div class="glabels">${LEVELS.map((l,i)=>`<span>${l}<br>${Math.round(st.kg[i])}</span>`).join('')}</div></div>
   <div class="ex-sub">和你差不多的人（${p.age?p.age+' 歲、':''}${p.sex==='f'?'女':'男'}、${p.h} cm、${p.w} kg）大多落在 ${lo}–${hi} kg 之間。依公開的力量標準估算，僅供參考。</div></div>`;
}

const EQKEY={'槓鈴':'bb','EZ槓':'bb','啞鈴':'db','壺鈴':'kb','彈力帶':'band','器械':'gym','繩索':'gym','史密斯':'gym','自體重':null};

function availEx(ex,eq){
  if(!eq||eq.includes('gym')) return true;

const PREF=['db','kb','band','bb',null];
const HARD=new Set(['bw_nordic','m_ghr','bw_sissy','bw_pike_pushup','bw_vup','bw_ab_wheel','bw_box_jump','bw_burpee']);
const REL={'腿後':['臀'],'臀':['腿後'],'肩':['背'],'二頭':['背'],'前臂':['背'],'小腿':['股四頭']};
const coreName=n=>n.replace(/啞鈴|槓鈴|彈力帶|繩索|史密斯|徒手|器械|機|（.*?）|\s/g,'');
function substitute(exId,eq,used){
  const ex=EX(exId),m0=musclesOf(ex)[0],sec=ex.unit==='秒',cn=coreName(ex.name),groups=[ex.group,...(REL[ex.group]||[])];
  const pool=BASE_EX.filter(e=>e.id!==exId&&!used.has(e.id)&&groups.includes(e.group)&&e.group!=='有氧'&&availEx(e,eq));
  const shared=e=>{const c=coreName(e.name);let k=0;for(const ch of new Set(c))if(cn.includes(ch))k++;return k};
  const score=e=>(e.group===ex.group?0:4)+(e.compound===ex.compound?0:6)+(musclesOf(e)[0]===m0?0:4)+PREF.indexOf(EQKEY[e.equip]??null)*.5+((e.unit==='秒')!==sec?3:0)+(HARD.has(e.id)?7:0)-shared(e);
  pool.sort((a,b)=>score(a)-score(b));
  return pool[0]||null;

// swap every exercise the equipment can't support for the closest one it can; returns how many changed
function adaptPlan(plan,eq){
  let n=0;
  plan.days.forEach(d=>{const used=new Set(d.exercises.map(e=>e.exId));
    d.exercises=d.exercises.map(pe=>{const ex=EX(pe.exId);if(availEx(ex,eq)) return pe;
      const sub=substitute(pe.exId,eq,used);n++;if(!sub) return null;used.add(sub.id);
      const toBw=sub.equip==='自體重'&&ex.equip!=='自體重';
      return {...pe,exId:sub.id,_new:true,repMin:sub.unit==='秒'?30:toBw?12:pe.repMin,repMax:sub.unit==='秒'?45:toBw?15:pe.repMax};
    }).filter(Boolean)});

}

/* ---------- progression: double progression for hypertrophy ----------
   Work inside the rep range. Every working set at the top of the range -> add load.
   Inside the range -> same load, beat last time's reps. Below the range twice in a row -> drop ~10%.
   When reps land far outside the range (first sessions, bad estimate), jump straight to the load
   that an estimated 1RM (Epley) predicts for the middle of the range. */

  a.items.forEach(it=>{
    const pe=day&&day.exercises.find(x=>x.id===it.peId);
    const done=it.sets.filter(s=>s.done);
    if(!pe||!done.length) return;
    const ex=EX(it.exId),inc=incOf(ex);
    if(ex.group==='有氧') return;
    if(!adjustable){out.push({exId:it.exId,kind:'hold',tag:'不調整',why:P.name+'只照表操課，基準重量等基礎／負荷週再調整'});return}

    const work=done.filter(s=>(+s.w||0)>=w*.97),reps=work.map(s=>+s.r||0);

    if(w===0){

    }
    const e1=Math.max(...work.map(s=>e1rm(+s.w,+s.r)));
    const fit=Math.floor(e1/(1+mid/30)/inc)*inc;
    let next=w,kind='hold',tag='維持',why='';
    const farAbove=reps[0]>=it.rmax+3, farBelow=reps.some(r=>r<=it.rmin-3);
    if(farAbove||farBelow){
      next=Math.min(w*1.3,Math.max(w*.7,fit));next=Math.max(inc,Math.round(next/inc)*inc);
      kind=next>w?'up':next<w?'down':'hold';
      why=farAbove?`做了 ${reps[0]} 下，比目標多很多，直接調到適合 ${it.rmin}-${it.rmax} 下的重量`:`次數離目標太遠，直接調到做得完 ${it.rmin}-${it.rmax} 下的重量`;
      pe.miss=0;
    }else if(allDone&&reps.every(r=>r>=it.rmax)){
      next=Math.max(w+inc,Math.min(fit,w+inc*2));kind='up';why=`每組都做到 ${it.rmax} 下，加重繼續進步`;pe.miss=0;
    }else if(reps.some(r=>r<it.rmin)){
      pe.miss=(pe.miss||0)+1;
      if(pe.miss>=2){next=Math.max(inc,Math.floor(w*.9/inc)*inc);kind='down';why='連續兩次沒達到最低次數，先減重把次數做足';pe.miss=0}
      else why=`有組沒到 ${it.rmin} 下，下次同重量再挑戰`;
    }else{pe.miss=0;why=`在 ${it.rmin}-${it.rmax} 下之間，同重量每組多做 1 下`}
    tag=kind==='up'?'+'+fw(next-w)+' kg':kind==='down'?'−'+fw(w-next)+' kg':'維持';
    pe.weight=Math.round(next/P.mult*100)/100;
    out.push({exId:it.exId,kind,tag,why:why+(kind!=='hold'?`（${fw(w)} → ${fw(next)} kg）`:'')});
  });
  return out;
}
