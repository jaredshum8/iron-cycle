<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="鐵週期">
<meta name="theme-color" content="#0D1015">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:var(--top,env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>鐵週期</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: single-column phone app, max 520px, fixed tab bar; the whole UI tints itself with the current week's bumper-plate color. */
:root{
  --bg:#0D1015; --surface:#151920; --surface2:#1D222B; --line:#272D38; --line2:#323947;
  --text:#EEF1F5; --muted:#8C94A3; --faint:#5E6676;
  --on-phase:#0B0E13; --danger:#FF6B6B; --ok:#3DDC97;
  --phase:#3DDC97; --phase-soft:rgba(61,220,151,.14);
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Barlow Condensed","DIN Alternate","Arial Narrow",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --top:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
/* Home-screen web apps on newer iOS blur the strip under the status bar: keep content clear of it */
.standalone{--top:max(calc(env(safe-area-inset-top,0px) + 22px),72px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--phase);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
h1{font-size:28px;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);font-weight:700;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--phase);color:var(--on-phase);border-color:transparent}
.btn.big{height:56px;font-size:17px;border-radius:16px;width:100%;letter-spacing:.08em}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2)}
.icon-btn svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.ph{background:var(--phase-soft);color:var(--phase);border-color:transparent}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}

/* top */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:10px}
.brand{font-family:var(--f-num);font-weight:700;letter-spacing:.24em;font-size:12px;color:var(--phase)}

/* phase card */
.phase-card{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px;background:var(--surface);border:1px solid var(--line)}
.phase-card .plate{position:absolute;right:-38px;top:-38px;width:150px;height:150px;border-radius:50%;border:16px solid var(--phase);opacity:.16}
.phase-card .plate::after{content:"";position:absolute;inset:38px;border-radius:50%;border:6px solid var(--phase)}
.phase-name{font-size:26px;font-weight:900;color:var(--phase);line-height:1.15}
.phase-en{font-family:var(--f-num);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--muted)}
.cyc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.cyc div{display:flex;flex-direction:column;gap:6px}
.cyc i{display:block;height:8px;border-radius:4px;background:var(--line2)}
.cyc span{font-size:11px;color:var(--faint);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cyc .cur span{color:var(--text)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:14px;border:1.5px solid transparent;color:var(--muted)}
.wd b{font-family:var(--f-num);font-size:21px;font-weight:600;color:var(--text);line-height:1.1}
.wd small{font-size:11px;font-weight:700}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.wd .dot.plan{background:var(--line2)}
.wd .dot.plan.has{background:var(--phase)}
.wd .dot.done{background:var(--ok)}
.wd.today b{color:var(--phase)}
.wd.sel{border-color:var(--phase);background:var(--phase-soft)}

/* day */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.day-title{font-size:24px;font-weight:900}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta b{font-family:var(--f-num);font-size:18px;color:var(--text);font-weight:600;margin-right:3px}
.ex-list{display:flex;flex-direction:column}
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.ex-row:first-child{border-top:0}
.ex-badge{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--muted);flex:none;border:1px solid var(--line2)}
.ex-name{font-weight:700;font-size:15px;line-height:1.3}
.ex-sub{font-size:13px;color:var(--muted)}
.ex-sub .num{font-size:15px;color:var(--text)}
.chev{width:18px;height:18px;color:var(--faint);flex:none}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--phase);color:var(--on-phase);font-weight:700;width:100%;text-align:left}
.banner .num{font-size:22px}
.rest-day{text-align:center;padding:30px 16px}
.rest-day h2{font-size:22px;font-weight:900;margin-bottom:6px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,16,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;font-weight:700;color:var(--faint)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--phase)}

/* library */
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:32px;padding:0 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.group-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin:14px 2px 2px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.tile .num{font-size:32px;font-weight:600;line-height:1}
.tile small{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--faint);font-weight:700;padding:4px 0}
.cal button{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-num);font-size:17px;color:var(--muted)}
.cal button.has{color:var(--text);background:var(--surface2)}
.cal button.sel{outline:1.5px solid var(--text)}
.cal button.today{color:var(--phase)}
.cal i{width:5px;height:5px;border-radius:50%}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:44px 1fr 28px;align-items:center;gap:8px;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--phase);border-radius:5px}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-child{border-top:0}
.log-sets{font-size:13px;color:var(--muted);margin-top:6px;display:flex;flex-direction:column;gap:3px}
.log-sets b{color:var(--text);font-weight:500}

/* settings */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.set-item:first-child{border-top:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);font-size:18px;font-weight:700}
.stepper .num{min-width:56px;text-align:center;font-size:20px}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle.on{background:var(--phase)}
.toggle.on::after{transform:translateX(20px);background:var(--on-phase)}
textarea{width:100%;min-height:120px;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;color:var(--text);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

/* session */
.sess{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top)}
.sess-top{flex:none;border-bottom:1px solid var(--line);background:var(--bg)}
.sess-top .in{max-width:520px;margin:0 auto;padding:14pxmax(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.stats .num{font-size:20px;font-weight:600;line-height:1.1}
.sess-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sess-body .in{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 200px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.progress-dots{display:flex;gap:4px}
.progress-dots i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.progress-dots i.done{background:var(--ok)}
.progress-dots i.cur{background:var(--phase)}
.ex-title{font-size:26px;font-weight:900;line-height:1.2;text-wrap:balance}
.pr-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:end}
.pr-row .num{font-size:30px;font-weight:600;line-height:1}
.spark{width:100%;height:56px;display:block}
.warm{border-radius:16px;border:1px dashed var(--line2);padding:12px 14px}
.warm summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
.warm summary::-webkit-details-marker{display:none}
.warm ol{margin:10px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.warm li{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.warm li .num{color:var(--text);font-size:18px}
.target{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.target .num{font-size:20px;color:var(--text)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 56px;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.set-n{display:grid;place-items:center;font-family:var(--f-num);font-size:18px;color:var(--faint);font-weight:600}
.fld{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--surface2);border-radius:12px;padding:6px 4px;min-width:0}
.fld .in-row{display:flex;align-items:baseline;justify-content:center;gap:3px;width:100%}
.fld input{width:100%;max-width:90px;text-align:center;background:none;border:0;outline:0;font-family:var(--f-num);font-size:30px;font-weight:600;padding:0;line-height:1.1;min-width:0}
.fld input::placeholder{color:var(--faint)}
.fld .u{font-size:12px;color:var(--muted);flex:none}
.fld small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chk{border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:1.5px solid var(--line2);color:var(--faint)}
.chk svg{width:26px;height:26px}
.set.done{background:var(--phase-soft);border-color:transparent}
.set.done .chk{background:var(--phase);color:var(--on-phase);border-color:transparent}
.set.done .set-n{color:var(--phase)}
.set.done input{color:var(--phase)}
.sess-foot{flex:none;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.sess-foot .in{max-width:520px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px}
.sess-foot .btn{flex:1;height:50px}

/* rest timer */
.rest{position:fixed;left:0;right:0;z-index:45;bottom:calc(71px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.rest .in{max-width:496px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.rest .ring{width:56px;height:56px;flex:none;position:relative}
.rest .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.rest .clock{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rest small{display:block;font-size:12px;font-weight:700;opacity:.65}
.rest .rb{height:36px;min-width:42px;padding:0 8px;border-radius:10px;background:rgba(0,0,0,.08);font-weight:700;font-size:13px;color:var(--bg)}
.rest .rb.go{background:var(--bg);color:var(--text)}
.rest.over .in{background:var(--phase);color:var(--on-phase)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:560px;max-height:90%;background:var(--surface);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet-b{overflow-y:auto;padding:4px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:10px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));display:flex;gap:10px;border-top:1px solid var(--line)}
.sheet-f .btn{flex:1}
.dialog{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.dialog .box{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog .row .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);padding:0 12px;outline:0;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(14px + var(--top));transform:translateX(-50%);z-index:100;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);animation:fade .2s ease}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ok)}

/* names, demos, tutorials */
.en{font-family:var(--f-num);font-size:13px;letter-spacing:.03em;color:var(--faint);font-weight:500;line-height:1.25}
.demo{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:12px;overflow:hidden;background:#fff}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img.b{animation:flip 2.4s steps(1,end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.demo .approx{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;background:rgba(13,16,21,.75);color:#EEF1F5;padding:2px 6px;border-radius:6px}
.tut{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tut summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
.tut summary::-webkit-details-marker{display:none}
.tut-grid{display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
.cues{margin:0;padding:0 0 0 18px;font-size:13px;line-height:1.5;color:var(--text);display:flex;flex-direction:column;gap:4px}
.cues li::marker{color:var(--phase);font-family:var(--f-num);font-weight:700}
.warn{font-size:13px;color:#FFB4A8;background:rgba(255,107,107,.1);border-radius:10px;padding:8px 10px}
.links{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none;color:var(--text)}
/* auth & onboarding */
.full{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.full .wrap{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));width:100%}
.hero-mark{width:64px;height:64px;border-radius:50%;border:9px solid var(--phase);position:relative}
.hero-mark::after{content:"";position:absolute;inset:12px;border-radius:50%;border:4px solid var(--phase)}
.lead{font-size:15px;color:var(--muted);margin:0}
.msg{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.gbtn{background:#fff;color:#1F1F1F;border-color:#fff;letter-spacing:.02em}.gbtn svg{width:22px;height:22px}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.steps i.on{background:var(--phase)}
.big-q{font-size:26px;font-weight:900;line-height:1.25;text-wrap:balance}
.tiles5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tiles5 button,.wdpick button{height:72px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line2);font-family:var(--f-num);font-size:32px;font-weight:600}
.tiles5 button small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.tiles5 button.on,.wdpick button.on{border-color:var(--phase);background:var(--phase-soft);color:var(--phase)}
.wdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wdpick button{height:58px;font-family:var(--f-body);font-size:16px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line2);border-radius:16px;padding:14px 16px}
.opt.on{border-color:var(--phase);background:var(--phase-soft)}
.opt b{display:block;font-size:16px}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt .days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.fld input{font-size:25px}.set{grid-template-columns:22px 1fr 1fr 48px;gap:6px}.tile .num{font-size:26px}}

function buildPlan(wds,keys){

const CFG=window.IC_CONFIG||{};

const userDoc=()=>DB.collection('users').doc(user.id);
const Cloud={status:'local',chain:Promise.resolve(),timer:null,hadRemote:false,
  async pull(){
    if(!DB||!user) return;
    try{
      const [d,ls]=await Promise.all([userDoc().get(),userDoc().collection('logs').orderBy('end','desc').limit(3000).get()]);
      const remote=d.exists&&d.data().json?JSON.parse(d.data().json):null;this.hadRemote=!!remote;
      if(remote&&(remote.updatedAt||0)>(state.updatedAt||0)){state=remote;migrate();LS.set(key('state'),state)}
      else if(state.updatedAt) this.queueState(true);
      const rl=ls.docs.map(x=>{try{return JSON.parse(x.data().json)}catch(e){return null}}).filter(Boolean);
      const ids=new Set(rl.map(l=>l.id));const localOnly=logs.filter(l=>!ids.has(l.id));
      logs=[...rl,...localOnly].sort((a,b)=>b.end-a.end);saveLogs();
      localOnly.forEach(l=>this.putLog(l));
      this.status='cloud';rebuildEx();
    }catch(e){this.status='offline'}
    render();
  },
  run(fn){this.chain=this.chain.then(fn).then(()=>{this.status='cloud'}).catch(()=>{this.status='offline'})},
  queueState(now){
    if(!DB||!user) return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{const json=JSON.stringify(state),ref=userDoc();this.run(()=>ref.set({json,updatedAt:state.updatedAt||Date.now()}))},now?0:900);
  },
  putLog(l){if(!DB||!user)return;const ref=userDoc().collection('logs').doc(l.id);this.run(()=>ref.set({json:JSON.stringify(l),end:l.end}))},
  delLog(id){if(!DB||!user)return;const ref=userDoc().collection('logs').doc(id);this.run(()=>ref.delete())},
};

const allEx=()=>BASE_EX.concat((state&&state.customEx)||[]);
let EXMAP={};const rebuildEx=()=>{EXMAP={};allEx().forEach(e=>EXMAP[e.id]=e)};rebuildEx();
const EX=id=>EXMAP[id]||{id,name:'未知動作',group:'全身',equip:'器械',compound:false};
const incOf=ex=>INC[ex.equip]||2.5;
const restOf=exId=>state.restByEx[exId]??(EX(exId).compound?state.settings.restCompound:state.settings.restIso);
function phaseAt(date){
  if(!state.settings.periodize) return {idx:-1,cycle:0,week:0};
  const w=Math.max(0,Math.floor(between(state.settings.cycleStart,date)/7));
  return {idx:w%5,cycle:Math.floor(w/5)+1,week:w%5+1};
}
function prescribe(pe,ph){
  const ex=EX(pe.exId),inc=incOf(ex);
  const sets=Math.max(1,Math.round(pe.sets*ph.setsF));
  const rmin=Math.max(1,Math.round(pe.repMin*ph.repF));
  const rmax=Math.max(rmin,Math.round(pe.repMax*ph.repF));
  const w=pe.weight>0?Math.max(inc,roundTo(pe.weight*ph.mult,inc)):0;
  return {sets,rmin,rmax,w};
}
function dayFor(date){
  const ov=state.overrides[date];
  const day=ov?state.plan.days.find(d=>d.id===ov.dayId):state.plan.days.find(d=>d.wd===pd(date).getDay());
  if(!day) return null;
  return {day,exercises:ov&&ov.exercises?ov.exercises:day.exercises,ov};
}
function lastSets(exId,beforeEnd){
  for(const l of logs){ if(beforeEnd&&l.end>=beforeEnd) continue; const it=l.items.find(i=>i.exId===exId); if(it&&it.sets.length) return it.sets }
  return null;
}
function history(exId){
  const out=[];
  for(const l of logs){const it=l.items.find(i=>i.exId===exId);if(it&&it.sets.length){const top=it.sets.reduce((a,s)=>s.w>a.w||(s.w===a.w&&s.r>a.r)?s:a,it.sets[0]);out.push({date:l.date,end:l.end,top,sets:it.sets,best1:Math.max(...it.sets.map(s=>e1rm(s.w,s.r)))})}}
  return out.sort((a,b)=>a.end-b.end);
}
function bestOf(exId){const h=history(exId);if(!h.length)return null;return h.reduce((a,x)=>x.top.w>a.top.w||(x.top.w===a.top.w&&x.top.r>a.top.r)?x:a,h[0])}
function estMinutes(list,ph){let s=0;list.forEach(pe=>{const p=prescribe(pe,ph);s+=p.sets*(restOf(pe.exId)+45)});return Math.round(s/60)}

  const inRange=logs.filter(l=>range==='all'||now-l.end<=(+range)*864e5);
  const hrs=inRange.reduce((a,l)=>a+(l.end-l.start),0)/36e5;
  const vol=inRange.reduce((a,l)=>a+l.volume,0);
  const [y,m]=ui.calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1),startPad=first.getDay(),nDays=new Date(y,m,0).getDate();
  const byDate={};logs.forEach(l=>(byDate[l.date]=byDate[l.date]||[]).push(l));
  // weekly sets per muscle (last 7 days)
  const wk={};logs.filter(l=>now-l.end<=7*864e5).forEach(l=>l.items.forEach(it=>{const g=EX(it.exId).group;wk[g]=(wk[g]||0)+it.sets.length}));
  const maxS=Math.max(10,...Object.values(wk));
  const selLogs=ui.calSel?(byDate[ui.calSel]||[]):logs.slice(0,8);
  let h=`<div class="topbar"><div><div class="brand">IRON CYCLE</div><h1>進度</h1></div></div>
  <div class="seg">${[['7','7 天'],['30','30 天'],['180','6 個月'],['all','全部']].map(([k,l])=>`<button class="${range===k?'on':''}" data-act="range" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="tiles"><div class="tile"><div class="num">${inRange.length}</div><small>訓練次數</small></div><div class="tile"><div class="num">${hrs.toFixed(hrs<10?1:0)}</div><small>訓練時數</small></div><div class="tile"><div class="num">${kfmt(vol)}</div><small>總重量 kg</small></div></div>
  <section class="card stack"><div class="row between"><h2>${y} 年 ${m} 月</h2><div class="row" style="gap:6px"><button class="icon-btn" style="width:34px;height:34px" data-act="cal" data-d="-1" aria-label="上個月">${ICON.left}</button><button class="icon-btn" style="width:34px;height:34px" data-act="cal" data-d="1" aria-label="下個月">${ICON.right}</button></div></div>
   <div class="cal">${WD.map(w=>`<div class="h">${w}</div>`).join('')}${'<div></div>'.repeat(startPad)}${[...Array(nDays)].map((_,i)=>{const d=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;const has=byDate[d];const c=has?PH(has[0].phaseIdx).color:'';
     return `<button class="${has?'has':''} ${d===TODAY()?'today':''} ${ui.calSel===d?'sel':''}" data-act="calSel" data-d="${d}">${i+1}${has?`<i style="background:${c}"></i>`:''}</button>`}).join('')}</div>
  </section>
  <section class="card stack"><div class="row between"><h2>${ui.calSel?`${pd(ui.calSel).getMonth()+1}/${pd(ui.calSel).getDate()} 的訓練`:'最近訓練'}</h2>${ui.calSel?'<button class="btn sm ghost" data-act="calSel" data-d="">全部</button>':''}</div>
   <div>${selLogs.length?selLogs.map(logHTML).join(''):'<div class="empty">還沒有紀錄。完成第一次訓練後，這裡會列出每一組的重量與次數。</div>'}</div></section>
  <section class="card stack"><h2>近 7 天各部位組數</h2>${Object.keys(wk).length?`<div class="bars">${GROUPS.filter(g=>wk[g]).map(g=>`<div class="bar"><span>${g}</span><span class="t"><i style="width:${wk[g]/maxS*100}%"></i></span><span class="num" style="text-align:right">${wk[g]}</span></div>`).join('')}</div><div class="muted" style="font-size:12px">增肌常見建議：每個部位每週 10–20 組</div>`:'<div class="empty">本週還沒有訓練</div>'}</section>`;

/* ---------- Session ---------- */
function sessionTotals(){let v=0,r=0;state.active.items.forEach(it=>it.sets.forEach(s=>{if(s.done){v+=(+s.w||0)*(+s.r||0);r+=+s.r||0}}));return {v,r}}
function renderSession(){
  const a=state.active,it=a.items[a.idx],P=PH(a.phaseIdx);
  const tot=sessionTotals();
  let body='';
  if(!it){body='<div class="empty">今天沒有動作，按「調整」新增一個</div>'}
  else{
    const ex=EX(it.exId),best=bestOf(it.exId),h=history(it.exId).slice(-16),last=lastSets(it.exId);
    const allDone=it.sets.length&&it.sets.every(s=>s.done);
    body+=`<div class="progress-dots">${a.items.map((x,i)=>`<i class="${x.sets.length&&x.sets.every(s=>s.done)?'done':i===a.idx?'cur':''}"></i>`).join('')}</div>
    <div><div class="row" style="gap:6px;margin-bottom:6px"><span class="chip ph">${P.name}</span><span class="chip">${ex.group}</span><span class="chip">${ex.equip}</span></div>
     <div class="ex-title">${esc(ex.name)}</div>${ex.en?`<div class="en" style="font-size:16px;margin-top:2px">${esc(ex.en)}</div>`:''}</div>`;
    body+=tutHTML(ex);
    if(best){
      body+=`<div class="card pr-row"><div><div class="eyebrow">最佳紀錄</div><div class="num" style="margin-top:6px">${fw(best.top.w)}<span style="font-size:15px;color:var(--muted)"> kg × ${best.top.r}</span></div><div class="muted" style="font-size:12px;margin-top:4px">${best.date.replace(/-/g,'/')}</div></div>${sparkSVG(h.map(x=>x.top.w))}</div>`;
    }
    if(ex.compound&&it.sugg>=30&&['槓鈴','史密斯'].includes(ex.equip)){
      const bar=ex.equip==='槓鈴'?20:15,inc=incOf(ex),W=it.sugg;
      const steps=[[bar,10,'空槓'],[Math.max(bar,roundTo(W*.5,inc)),5,'輕'],[Math.max(bar,roundTo(W*.7,inc)),3,'中'],[Math.max(bar,roundTo(W*.85,inc)),1,'中重']];
      body+=`<details class="warm" ${it.warm?'':'open'}><summary><span>${it.warm?'✓ 熱身完成':'熱身組'}</span><span class="muted" style="font-size:13px">${it.warm?'展開':'依今天重量計算'}</span></summary>
       <ol>${steps.map(([w,r,l])=>`<li><span class="num">${fw(w)}</span> kg × ${r}　${l}</li>`).join('')}</ol>
       ${it.warm?'':`<button class="btn sm" style="margin-top:10px;width:100%" data-act="warmDone">熱身完成</button>`}</details>`;
    }
    body+=`<div class="target"><span>目標</span><span class="num">${it.sets.length}</span>組 ×<span class="num">${it.rmin===it.rmax?it.rmin:it.rmin+'-'+it.rmax}</span>次 <span class="grow"></span><button class="btn sm ghost" data-act="restEdit" data-ex="${it.exId}">${ICON.timer}休息 ${mmss(restOf(it.exId))}</button></div>
    <div class="sets">${it.sets.map((s,i)=>{const ls=last&&(last[i]||last[last.length-1]);
      return `<div class="set ${s.done?'done':''}" data-i="${i}"><div class="set-n">${i+1}</div>
       <label class="fld"><span class="in-row"><input inputmode="decimal" data-f="w" data-i="${i}" value="${s.w===''?'':fw(s.w)}" placeholder="0" aria-label="第${i+1}組重量"><span class="u">kg</span></span><small>${ls?'上次 '+fw(ls.w):'建議 '+fw(it.sugg)}</small></label>
       <label class="fld"><span class="in-row"><input inputmode="numeric" data-f="r" data-i="${i}" value="${esc(s.r)}" placeholder="${it.rmax}" aria-label="第${i+1}組次數"><span class="u">次</span></span><small>${ls?'上次 '+ls.r:'目標 '+(it.rmin===it.rmax?it.rmin:it.rmin+'-'+it.rmax)}</small></label>
       <button class="chk" data-act="setDone" data-i="${i}" aria-label="完成第${i+1}組">${ICON.check}</button></div>`}).join('')}</div>
    <div class="row"><button class="btn sm" data-act="addSet">${ICON.plus}加一組</button>${it.sets.length>1?'<button class="btn sm ghost" data-act="rmSet">減一組</button>':''}<span class="grow"></span><button class="btn sm" data-act="customizeSess">${ICON.edit}調整動作</button></div>
    ${allDone&&a.idx<a.items.length-1?`<div class="card" style="text-align:center">這個動作完成了 💪<div class="muted" style="font-size:13px">下一個：${esc(EX(a.items[a.idx+1].exId).name)}</div></div>`:''}`;
  }
  const isLast=a.idx>=a.items.length-1;
  return `<div class="sess">
   <div class="sess-top"><div class="in"><button class="btn sm" data-act="exitSess">離開</button>
    <div class="stats"><div><small>時間</small><div class="num" id="sessClock">${hms(Date.now()-a.startedAt)}</div></div><div><small>總量 kg</small><div class="num">${kfmt(tot.v)}</div></div><div><small>次數</small><div class="num">${tot.r}</div></div></div>
    <button class="btn sm" data-act="exList">${a.idx+1}/${a.items.length}</button></div></div>
   <div class="sess-body" id="sessBody"><div class="in">${body}</div></div>
   <div class="sess-foot"><div class="in"><button class="btn" data-act="prevEx" ${a.idx===0?'disabled style="opacity:.4"':''}>${ICON.left}上一個</button>
    ${isLast?'<button class="btn primary" data-act="finish">完成訓練</button>':`<button class="btn primary" data-act="nextEx">下一個${ICON.right}</button>`}</div></div>
   ${renderRest()}
  </div>`;
}
function sparkSVG(vals){
  if(vals.length<2) return '<div></div>';
  const W=200,H=56,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(W-8)+4,H-6-(v-mn)/rg*(H-14)]);
  const line=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="重量趨勢"><polygon points="4,${H} ${line} ${W-4},${H}" fill="var(--phase-soft)"/><polyline points="${line}" fill="none" stroke="var(--phase)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--phase)"/></svg>`;
}
function renderRest(){
  const r=state.active&&state.active.rest;if(!r) return '';
  const left=(r.endAt-Date.now())/1000,over=left<=0;
  const C=2*Math.PI*24,frac=Math.max(0,Math.min(1,left/r.total));
  return `<div class="rest ${over?'over':''}" id="rest"><div class="in">
   <div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="5"/><circle id="restArc" cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg></div>
   <div class="grow"><small id="restLbl">${over?'休息結束，開始下一組':'休息中'}</small><div class="clock" id="restClock">${over?'+'+mmss(-left):mmss(left)}</div></div>
   <button class="rb" data-act="restAdd" data-d="-15">−15</button><button class="rb" data-act="restAdd" data-d="15">+15</button><button class="rb go" data-act="restSkip">${over?'關閉':'跳過'}</button></div></div>`;
}
function bindSessionScroll(){const b=document.getElementById('sessBody');if(b&&ui.keepScroll!=null){b.scrollTop=ui.keepScroll;ui.keepScroll=null}}
function rerenderSession(keep=true){const b=document.getElementById('sessBody');if(keep&&b) ui.keepScroll=b.scrollTop;render()}

/* ---------- rest timer & audio ---------- */
let actx=null;
function unlockAudio(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(state.settings.vibrate&&navigator.vibrate) try{navigator.vibrate([200,100,200])}catch(e){}
  if(!state.settings.sound||!actx) return;
  try{[0,.28,.56].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain(),T0=actx.currentTime+t;o.type='sine';o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,T0);g.gain.exponentialRampToValueAtTime(.35,T0+.02);g.gain.exponentialRampToValueAtTime(.0001,T0+.22);o.connect(g).connect(actx.destination);o.start(T0);o.stop(T0+.25)})}catch(e){}
}
function startRest(exId){const sec=restOf(exId);state.active.rest={endAt:Date.now()+sec*1000,total:sec,exId,beeped:false}}
setInterval(()=>{
  if(!state.active) return;
  const c=document.getElementById('sessClock')||document.getElementById('bannerClock');
  if(c) c.textContent=hms(Date.now()-state.active.startedAt);
  const r=state.active.rest;if(!r) return;
  const left=(r.endAt-Date.now())/1000;
  if(left<=0&&!r.beeped){r.beeped=true;beep();save();if(ui.inSession) rerenderSession();return}
  const el=document.getElementById('restClock');
  if(el){el.textContent=left<=0?'+'+mmss(-left):mmss(left);
    const arc=document.getElementById('restArc');if(arc){const C=2*Math.PI*24;arc.setAttribute('stroke-dashoffset',C*(1-Math.max(0,Math.min(1,left/r.total))))}}
  if(left<-600){state.active.rest=null;save();if(ui.inSession)rerenderSession()}
},250);
let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.active&&ui.inSession)keepAwake()});

/* ---------- sessions ---------- */
function makeItem(pe,P){
  const p=prescribe(pe,P),last=lastSets(pe.exId);
  const sugg=p.w||(last?last[0].w:0);
  return {key:uid(),exId:pe.exId,peId:pe.id,rmin:p.rmin,rmax:p.rmax,sugg,warm:false,sets:Array.from({length:p.sets},()=>({w:sugg,r:'',done:false}))};
}
function startSession(date){
  const r=dayFor(date);if(!r) return;
  const ph=phaseAt(TODAY()),P=PH(ph.idx);
  state.active={id:uid(),date:TODAY(),planDate:date,dayId:r.day.id,dayName:r.day.name,phaseIdx:ph.idx,cycle:ph.cycle,startedAt:Date.now(),idx:0,items:r.exercises.map(pe=>makeItem(pe,P)),rest:null};
  ui.inSession=true;save();keepAwake();render();
}
function sessionEnd(a){
  const now=Date.now();if(now-a.startedAt<6*36e5) return now;
  let last=0;a.items.forEach(it=>it.sets.forEach(s=>{if(s.done&&s.at)last=Math.max(last,s.at)}));
  return last?Math.min(now,last+2*6e4):a.startedAt+60*6e4;
}
function finishSession(){
  const a=state.active;
  const items=a.items.map(it=>({exId:it.exId,sets:it.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0}))})).filter(it=>it.sets.length);
  if(!items.length){ui.dialog={title:'還沒有完成任何一組',msg:'要直接放棄這次訓練嗎？不會留下紀錄。',ok:'放棄訓練',danger:true,onOk:()=>{state.active=null;ui.inSession=false;save();render()}};render();return}
  const volume=items.reduce((t,it)=>t+it.sets.reduce((x,s)=>x+s.w*s.r,0),0);
  const reps=items.reduce((t,it)=>t+it.sets.reduce((x,s)=>x+s.r,0),0);
  const log={id:uid(),date:a.date,dayName:a.dayName,phaseIdx:a.phaseIdx,cycle:a.cycle,start:a.startedAt,end:sessionEnd(a),items,volume,reps};
  // PRs vs previous history
  const prs=[];items.forEach(it=>{const b=bestOf(it.exId);const top=Math.max(...it.sets.map(s=>s.w));if(top>0&&(!b||top>b.top.w))prs.push(EX(it.exId).name+' '+fw(top)+' kg')});
  // auto progression on base/load weeks
  const ups=[];
  if(['base','load','fixed'].includes(PH(a.phaseIdx).key)){
    a.items.forEach(it=>{
      const day=state.plan.days.find(d=>d.id===a.dayId);const pe=day&&day.exercises.find(x=>x.id===it.peId);
      if(!pe||!pe.weight) return;
      const ok=it.sets.length&&it.sets.every(s=>s.done&&(+s.r||0)>=it.rmax&&(+s.w||0)>=it.sugg);
      if(ok){const inc=incOf(EX(it.exId));pe.weight=Math.round((pe.weight+inc)*100)/100;ups.push(EX(it.exId).name+' +'+inc+' kg')}
    });
  }
  logs.unshift(log);saveLogs();Cloud.putLog(log);
  state.active=null;ui.inSession=false;save();
  ui.sheet={type:'summary',log,prs,ups};render();
}

function openCustomize({mode,date,peId,isNew,dayId}){
  let pe,dayName,phaseIdx,dId;
  if(mode==='session'){
    const a=state.active,it=a.items[a.idx];
    dId=a.dayId;dayName=a.dayName;phaseIdx=a.phaseIdx;
    if(isNew) pe={id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0};
    else{const planPe=(state.plan.days.find(d=>d.id===a.dayId)||{exercises:[]}).exercises.find(x=>x.id===it.peId);
      pe=planPe?clone(planPe):{id:it.peId||uid(),exId:it.exId,sets:it.sets.length,repMin:it.rmin,repMax:it.rmax,weight:it.sugg};
      pe.exId=it.exId;pe.sets=it.sets.length;}
  }else if(mode==='plan'){
    const d=state.plan.days.find(x=>x.id===dayId);dId=d.id;dayName=d.name;phaseIdx=0;
    pe=isNew?{id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0}:clone(d.exercises.find(x=>x.id===peId));
  }else{
    const r=dayFor(date);dId=r.day.id;dayName=r.day.name;phaseIdx=phaseAt(date).idx;
    pe=isNew?{id:uid(),exId:null,sets:3,repMin:8,repMax:12,weight:0}:clone(r.exercises.find(x=>x.id===peId));
  }
  const draft={...pe,rest:pe.exId?restOf(pe.exId):90};
  ui.sheet={type:'customize',mode,date,dayId:dId,dayName,phaseIdx,draft,isNew:!!isNew,origExId:pe.exId,scope:mode==='plan'?'plan':'today'};
  if(isNew){ui.sheet.type='picker';ui.sheet.after='custom';ui.pending={...ui.sheet,type:'customize'}}
  render();
}
function czApply(del){
  const s=ui.sheet,d=s.draft;
  if(!d.exId){toast('請先選擇動作');return}
  d.sets=Math.max(1,Math.min(12,parseInt(d.sets)||1));d.repMin=Math.max(1,parseInt(d.repMin)||1);d.repMax=Math.max(d.repMin,parseInt(d.repMax)||d.repMin);d.weight=Math.max(0,parseFloat(d.weight)||0);
  if(d.rest!==restOf(d.exId)||state.restByEx[d.exId]!=null) state.restByEx[d.exId]=d.rest;
  const pe={id:d.id,exId:d.exId,sets:d.sets,repMin:d.repMin,repMax:d.repMax,weight:d.weight};
  const applyList=(list)=>{const i=list.findIndex(x=>x.id===pe.id);if(del){if(i>=0)list.splice(i,1)}else if(i>=0)list[i]=clone(pe);else list.push(clone(pe))};
  const planDay=state.plan.days.find(x=>x.id===s.dayId);
  if(s.mode==='plan'){applyList(planDay.exercises)}
  else if(s.mode==='preview'){
    if(s.scope==='plan'){applyList(planDay.exercises);const ov=state.overrides[s.date];if(ov&&ov.exercises)applyList(ov.exercises)}
    else{const ov=state.overrides[s.date]||(state.overrides[s.date]={dayId:s.dayId,exercises:null});if(!ov.exercises)ov.exercises=clone(planDay.exercises);applyList(ov.exercises)}
  }else{
    const a=state.active,P=PH(a.phaseIdx);
    if(s.scope==='plan'&&planDay) applyList(planDay.exercises);
    if(del){a.items.splice(a.idx,1);a.idx=Math.max(0,Math.min(a.idx,a.items.length-1))}
    else if(s.isNew){a.items.push(makeItem(pe,P));a.idx=a.items.length-1}
    else{const it=a.items[a.idx],p=prescribe(pe,P);const changedEx=it.exId!==pe.exId;
      it.exId=pe.exId;it.peId=pe.id;it.rmin=p.rmin;it.rmax=p.rmax;const ns=p.w||it.sugg;
      if(changedEx){Object.assign(it,makeItem(pe,P),{key:it.key})}
      else{if(ns!==it.sugg){it.sets.forEach(x=>{if(!x.done)x.w=ns})}it.sugg=ns;
        while(it.sets.length<pe.sets)it.sets.push({w:ns,r:'',done:false});
        while(it.sets.length>pe.sets&&!it.sets[it.sets.length-1].done)it.sets.pop();}
    }
  }
  pruneOverrides();
  const back=s.mode==='plan';
  ui.sheet=back?{type:'plan'}:null;save();render();
  toast(del?'已刪除':s.scope==='plan'||s.mode==='plan'?'已更新計畫':'已更新今天的菜單');
}

function demoHTML(ex){

    <div class="links" style="margin-top:10px"><a class="btn sm" href="${ytZh(ex)}" target="_blank" rel="noopener">YouTube 中文教學</a><a class="btn sm" href="${ytEn(ex)}" target="_blank" rel="noopener">英文教學</a></div></details>`;

function tutFull(ex){

  const o=ui.ob,steps=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=o.step?'on':''}"></i>`).join('')}</div>`;
  let body='',next='下一步',ok=true;

    body=`<div class="big-q">一週想練幾天？</div><p class="lead">之後隨時可以在「編輯計畫」改。</p>
    <div class="tiles5">${[2,3,4,5,6].map(n=>`<button class="${o.n===n?'on':''}" data-act="obN" data-n="${n}">${n}<small>天</small></button>`).join('')}</div>`;
  }else if(o.step===2){
    ok=o.wds.length===o.n;

const sortWds=w=>w.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
function sheetExitSess(){

async function boot(){
  loadLocal();
  if(AUTH){
    let settled=false;
    const first=new Promise(res=>{const un=AUTH.onAuthStateChanged(fu=>{
      if(!settled){settled=true;res(fu);return}
      if(fu) afterLogin(fu);
    })});
    AUTH.getRedirectResult().catch(e=>{ui.auth.msg=authMsg(e);ui.auth.busy=false;if(ui.screen==='auth')render()});
    const fu=await Promise.race([first,new Promise(r=>setTimeout(()=>r('timeout'),6000))]);
    if(fu&&fu!=='timeout'){await afterLogin(fu);return}
    if(!LS.get('ic.guest')) ui.screen='auth';
  }
  ui.inSession=!!state.active;checkStale();render();
}

/* ---------- boot ---------- */
try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('standalone')}catch(e){}
boot();
function checkStale(){
  const a=state.active;if(!a||Date.now()-a.startedAt<6*36e5) return;
  ui.inSession=false;
  const done=a.items.some(it=>it.sets.some(s=>s.done));
  ui.dialog=done
    ?{title:'上次的訓練忘了結束',msg:'要把已完成的組存成紀錄嗎？時間會算到最後完成的那一組。',ok:'儲存紀錄',danger:false,onOk:finishSession}
    :{title:'上次的訓練忘了結束',msg:'這次訓練沒有完成任何一組，要放棄嗎？',ok:'放棄',danger:true,onOk:()=>{state.active=null;save();render()}};
}
